# The main pipeline for dabproject

resources:
  pipelines:
    dabproject_etl:
      name: dabproject_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/dabproject_etl"

      libraries:
        - glob:
            include: ../src/dabproject_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
